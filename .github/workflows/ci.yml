name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit, physics, version and offline-cache tests
        run: npm test
      - name: Browser test (headless Chrome)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:browser

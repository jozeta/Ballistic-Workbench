<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="description" content="Offline ballistics calculator for precision rifle shooters: trajectories, reticle holds, truing and printable DOPE cards." />
  <meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
  <link rel="manifest" href="./manifest.json" />
  <title>Ballistic Workbench</title>
  
  <link rel="stylesheet" href="./vendor/lada-glass/2.2.0/lada-glass.css" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/views/lab.css" />
  <link rel="stylesheet" href="./styles/views/dope.css" />
  <link rel="stylesheet" href="./styles/views/tools.css" />
  <link rel="stylesheet" href="./styles/views/library.css" />
  <link rel="stylesheet" href="./styles/views/guide.css" />
  <link rel="stylesheet" href="./styles/views/field.css" />
  <link rel="stylesheet" href="./styles/print.css" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
</head>
<body class="lg lg-backdrop">
  <a class="skip-link" href="#app-main-content">Skip to content</a>
  <svg class="app-art" aria-hidden="true" focusable="false"><use href="./assets/art.svg#backdrop"/></svg>

  <div class="lg-app">
    <nav class="lg-sidebar app-sidebar" aria-label="Main">
      <a class="lg-brand" href="#workspace"><span class="lg-mark"><svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#crosshair"/></svg></span><span class="brand-text">Ballistic Workbench</span></a>

      <button id="btn-cmd-palette-trigger" class="lg-btn sidebar-search" type="button" aria-label="Search commands">
        <svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#search"/></svg><span class="sidebar-search-text">Search</span><span class="lg-kbd" id="palette-kbd">⌘K</span>
      </button>

      <div class="lg-nav app-nav">
        <p class="lg-label nav-group">Start</p>
        <a href="#guide" class="nav-link" title="Guide" data-view="guide"><svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#guide"/></svg><span>Guide</span></a>
        <p class="lg-label nav-group">Shoot</p>
        <a href="#workspace" class="nav-link" title="Solver" data-view="workspace" aria-current="page"><svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#crosshair"/></svg><span>Solver</span></a>
        <a href="#field" class="nav-link" title="Field mode" data-view="field"><svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#field"/></svg><span>Field mode</span></a>
        <a href="#dopeStudio" class="nav-link" title="DOPE cards" data-view="dopeStudio"><svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#card"/></svg><span>DOPE cards</span></a>
        <p class="lg-label nav-group">Analyse</p>
        <a href="#solverLab" class="nav-link" title="Compare models" data-view="solverLab"><svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#compare"/></svg><span>Compare models</span></a>
        <a href="#tools" class="nav-link" title="Tools" data-view="tools"><svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#ruler"/></svg><span>Tools</span></a>
        <p class="lg-label nav-group">Data</p>
        <a href="#libraryManager" class="nav-link" title="Library" data-view="libraryManager"><svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#box"/></svg><span>Library</span></a>
      </div>

      <div class="sidebar-settings">
        <p class="lg-label nav-group">Units</p>
        <div class="lg-tabs sidebar-switch" role="radiogroup" aria-label="Units" id="units-switch">
          <button class="lg-tab" role="radio" type="button" data-units="metric" aria-checked="true">Metric</button>
          <button class="lg-tab" role="radio" type="button" data-units="imperial" aria-checked="false">Imperial</button>
        </div>
        <p class="lg-label nav-group">Theme</p>
        <div class="lg-tabs sidebar-switch" role="radiogroup" aria-label="Theme" id="theme-switch">
          <button class="lg-tab" role="radio" type="button" data-theme-set="system" aria-checked="true">System</button>
          <button class="lg-tab" role="radio" type="button" data-theme-set="dark" aria-checked="false">Dark</button>
          <button class="lg-tab" role="radio" type="button" data-theme-set="light" aria-checked="false">Light</button>
        </div>
        <p class="sidebar-version lg-small lg-muted">Version <span id="app-version" class="lg-mono"></span></p>
      </div>
    </nav>

    <main class="lg-main" id="app-main-content" tabindex="-1">
      <!-- Populated by the router in src/ui/app.js -->
    </main>
  </div>

  <!-- MAIN APPLICATION MODULE SCRIPT -->
  <script src="./vendor/lada-glass/2.2.0/lada-glass.js" defer></script>
  <script type="module" src="./src/ui/app.js"></script>
</body>
</html>

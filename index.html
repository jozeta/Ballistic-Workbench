<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ballistic Workbench - Precision External Ballistics, RK4 Trajectory Solver, Reticle Holdover Simulation, and DOPE Card Generator" />
  <meta name="theme-color" content="#0b0f17" />
  <link rel="manifest" href="./manifest.json" />
  <title>Ballistic Workbench | Precision External Ballistics & Tactical DOPE Engine</title>
  
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/print.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='%230b0f17' stroke='%2338bdf8' stroke-width='2'/%3E%3Cline x1='12' y1='2' x2='12' y2='22' stroke='%2338bdf8' stroke-width='2'/%3E%3Cline x1='2' y1='12' x2='22' y2='12' stroke='%2338bdf8' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23f59e0b'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- TACTICAL APP HEADER -->
  <header class="app-header">
    <div class="brand-section">
      <svg class="brand-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9" stroke="#38bdf8" />
        <circle cx="12" cy="12" r="4" stroke="#f59e0b" stroke-dasharray="2,2" />
        <line x1="12" y1="2" x2="12" y2="22" stroke="#38bdf8" />
        <line x1="2" y1="12" x2="22" y2="12" stroke="#38bdf8" />
        <circle cx="12" cy="12" r="1" fill="#f59e0b" />
      </svg>
      <div class="brand-title">BALLISTIC <span>WORKBENCH</span></div>
    </div>

    <!-- MAIN ROUTING NAVIGATION -->
    <nav class="nav-links">
      <a href="#workspace" class="nav-link active" data-view="workspace">🎯 Command Center</a>
      <a href="#solverLab" class="nav-link" data-view="solverLab">🔬 Algorithm Lab</a>
      <a href="#dopeStudio" class="nav-link" data-view="dopeStudio">🖨️ DOPE Studio</a>
      <a href="#tools" class="nav-link" data-view="tools">🛠️ Tools & Chrono</a>
      <a href="#libraryManager" class="nav-link" data-view="libraryManager">📦 Library</a>
    </nav>

    <!-- QUICK ACTIONS & GLOBAL CONTROLS -->
    <div class="header-actions">
      <!-- Quick Environment Preset -->
      <select id="env-quick-select" class="form-select-sm" title="Quick Atmospheric Profile">
        <option value="env-icao-sea-level">ICAO Sea Level (15°C, 1013 hPa)</option>
        <option value="env-alpine-high">Alpine High (1,950m, 4°C)</option>
        <option value="env-desert-heat">Desert Heat (38°C, 925 hPa)</option>
        <option value="env-subzero-winter">Sub-Zero Winter (-12°C)</option>
      </select>

      <!-- Unit Switcher Button -->
      <button id="btn-units-toggle" class="btn-units-toggle" title="Switch between Metric (m/MRAD) and Imperial (yd/MOA)">
        <span class="unit-badge">SI</span> Metric (m · MRAD)
      </button>

      <!-- Theme Switcher Button (Dark / Light) -->
      <button id="btn-theme-toggle" class="btn-theme-toggle" title="Switch between Dark Nordic Tactical and High-Contrast Range Sunlight Mode">
        <span id="theme-toggle-icon">☀️</span> <span id="theme-toggle-label">High-Vis</span>
      </button>

      <!-- Command Palette Shortcut Trigger -->
      <button id="btn-cmd-palette-trigger" class="btn-cmd-palette" title="Open Command Palette (Ctrl+K)">
        <span>Search actions...</span>
        <span class="kbd-shortcut">⌘K</span>
      </button>
    </div>
  </header>

  <!-- DYNAMIC VIEW CONTAINER -->
  <main id="app-main-content">
    <!-- Populated dynamically by Router -->
  </main>

  <!-- APP FOOTER (version read from manifest.json) -->
  <footer class="app-footer">
    Ballistic Workbench <span id="app-version" class="app-version"></span>
  </footer>

  <!-- COMMAND PALETTE MODAL (Ctrl+K / Cmd+K) -->
  <div id="command-palette-modal" class="palette-modal">
    <div class="palette-backdrop"></div>
    <div class="palette-container">
      <div class="palette-search-wrapper">
        <input type="text" id="palette-search-input" class="palette-input" placeholder="Type a command or navigate... (e.g. Metric, 4DOF, Bergara, Chrono)" autocomplete="off" />
      </div>
      <div id="palette-results-list" class="palette-results"></div>
    </div>
  </div>

  <!-- MAIN APPLICATION MODULE SCRIPT -->
  <script type="module" src="./src/ui/app.js"></script>
</body>
</html>

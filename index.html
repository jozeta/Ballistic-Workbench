<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="description" content="Offline ballistics calculator for precision rifle shooters: trajectories, reticle holds, truing and printable DOPE cards." />
  <meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
  <link rel="manifest" href="./manifest.json" />
  <title>Ballistic Workbench</title>
  
  <link rel="stylesheet" href="./vendor/lada-glass/2.2.0/lada-glass.css" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/views/lab.css" />
  <link rel="stylesheet" href="./styles/views/dope.css" />
  <link rel="stylesheet" href="./styles/views/tools.css" />
  <link rel="stylesheet" href="./styles/views/library.css" />
  <link rel="stylesheet" href="./styles/print.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='%230b0f17' stroke='%2338bdf8' stroke-width='2'/%3E%3Cline x1='12' y1='2' x2='12' y2='22' stroke='%2338bdf8' stroke-width='2'/%3E%3Cline x1='2' y1='12' x2='22' y2='12' stroke='%2338bdf8' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23f59e0b'/%3E%3C/svg%3E" />
</head>
<body class="lg lg-backdrop">
  <a class="skip-link" href="#app-main-content">Skip to content</a>

  <header class="app-header">
    <a class="brand-section" href="#workspace" aria-label="Ballistic Workbench, go to Solver">
      <svg class="brand-logo-icon" aria-hidden="true"><use href="./assets/icons.svg#crosshair"/></svg>
      <span class="brand-title">Ballistic <span>Workbench</span></span>
    </a>

    <nav class="nav-links" aria-label="Main">
      <a href="#workspace" class="nav-link active" data-view="workspace" aria-current="page"><svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#crosshair"/></svg><span>Solver</span></a>
      <a href="#solverLab" class="nav-link" data-view="solverLab"><svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#chart"/></svg><span>Compare models</span></a>
      <a href="#dopeStudio" class="nav-link" data-view="dopeStudio"><svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#file"/></svg><span>DOPE cards</span></a>
      <a href="#tools" class="nav-link" data-view="tools"><svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#ruler"/></svg><span>Tools</span></a>
      <a href="#libraryManager" class="nav-link" data-view="libraryManager"><svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#box"/></svg><span>Library</span></a>
    </nav>

    <div class="header-actions">
      <button id="btn-units-toggle" class="btn-units-toggle" type="button" title="Switch units: metric (m, MRAD) or imperial (yd, MOA)">
        <span class="unit-badge">SI</span> Metric
      </button>

      <button id="btn-theme-toggle" class="btn-theme-toggle" type="button" title="Theme: follow system, light or dark">
        <svg class="lg-icon" aria-hidden="true"><use id="theme-toggle-icon" href="./assets/icons.svg#contrast"/></svg>
        <span id="theme-toggle-label">System</span>
      </button>

      <button id="btn-cmd-palette-trigger" class="btn-cmd-palette" type="button" title="Search commands (⌘K / Ctrl+K)" aria-label="Search commands">
        <svg class="lg-icon" aria-hidden="true"><use href="./assets/icons.svg#search"/></svg><span class="cmd-palette-text">Search</span>
        <kbd class="kbd-shortcut">⌘K</kbd>
      </button>
    </div>
  </header>

  <main id="app-main-content" tabindex="-1">
    <!-- Populated by the router in src/ui/app.js -->
  </main>

  <!-- APP FOOTER (version read from manifest.json) -->
  <footer class="app-footer">
    Ballistic Workbench <span id="app-version" class="app-version"></span>
  </footer>

  <!-- MAIN APPLICATION MODULE SCRIPT -->
  <script src="./vendor/lada-glass/2.2.0/lada-glass.js" defer></script>
  <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
